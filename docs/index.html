<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海公租房信息监控 - 每日房源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .update-time {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card .unit {
            font-size: 14px;
            color: #999;
            margin-left: 5px;
        }
        
        .stat-card.total .number { color: #667eea; }
        .stat-card.filtered .number { color: #f44336; }
        .stat-card.new .number { color: #4caf50; }
        .stat-card.avg-price .number { color: #ff9800; }
        
        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .filter-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .filter-card {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .filter-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .filter-card .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .filter-card .count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .house-list {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .house-list h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .house-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #4caf50;
            transition: all 0.3s;
        }
        
        .house-item:hover {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .house-item .name {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .house-item .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .house-item .info span {
            display: block;
        }
        
        .house-item .info .label {
            color: #999;
            font-size: 12px;
        }
        
        .house-item .info .value {
            color: #333;
            font-weight: 500;
        }
        
        .house-item .price {
            color: #f44336;
            font-size: 24px;
            font-weight: bold;
        }
        
        .house-item .tags {
            margin-top: 10px;
        }
        
        .house-item .tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .house-item .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🏠 上海公租房信息监控平台</h1>
            <p>实时监控浦东公租房房源，自动筛选符合条件房源</p>
            <span class="update-time">🕐 最后更新：正在加载...</span>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card total">
                <h3>📊 今日房源总数</h3>
                <div class="number" id="total-houses">-</div>
                <div class="unit">套</div>
            </div>
            <div class="stat-card filtered">
                <h3>✅ 符合条件房源</h3>
                <div class="number" id="filtered-houses">-</div>
                <div class="unit">套</div>
            </div>
            <div class="stat-card new">
                <h3>🆕 新增房源</h3>
                <div class="number" id="new-houses">-</div>
                <div class="unit">套</div>
            </div>
            <div class="stat-card avg-price">
                <h3>💰 平均租金</h3>
                <div class="number" id="avg-price">-</div>
                <div class="unit">元/月</div>
            </div>
        </div>
        
        <!-- 筛选方案 -->
        <div class="filter-section">
            <h2>🎯 启用的筛选方案</h2>
            <div id="filter-list">
                <p style="color: #999;">正在加载筛选方案...</p>
            </div>
        </div>
        
        <!-- 符合条件的房源 -->
        <div class="house-list">
            <h2>🏆 符合条件的房源</h2>
            <div id="house-items">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <p>正在加载数据...</p>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            <p>数据来源：浦东公租房官网 | 更新频率：每天8:00、9:00、10:00</p>
            <p style="margin-top: 10px;">仅供学习交流使用，请遵守相关法律法规</p>
        </div>
    </div>
    
    <script>
        // 从API加载最新数据
        async function loadData() {
            try {
                // 加载今日数据
                const todayResponse = await fetch('data/today.json');
                const todayData = await todayResponse.json();
                
                // 更新统计信息
                document.getElementById('total-houses').textContent = todayData.total || 0;
                document.getElementById('filtered-houses').textContent = todayData.filtered || 0;
                document.getElementById('new-houses').textContent = todayData.new || 0;
                document.getElementById('avg-price').textContent = todayData.avg_price || 0;
                
                // 更新时间
                document.querySelector('.update-time').textContent = 
                    `🕐 最后更新：${new Date(todayData.update_time).toLocaleString('zh-CN')}`;
                
                // 更新筛选方案
                const filterList = document.getElementById('filter-list');
                if (todayData.filters && todayData.filters.length > 0) {
                    filterList.innerHTML = todayData.filters.map(filter => `
                        <div class="filter-card">
                            <h3>${filter.name}</h3>
                            <div class="description">${filter.description}</div>
                            <div class="count">📌 ${filter.count} 套</div>
                        </div>
                    `).join('');
                } else {
                    filterList.innerHTML = '<p style="color: #999;">暂无筛选方案</p>';
                }
                
                // 更新房源列表
                const houseItems = document.getElementById('house-items');
                if (todayData.houses && todayData.houses.length > 0) {
                    houseItems.innerHTML = todayData.houses.map(house => `
                        <div class="house-item">
                            <div class="name">${house.house_name}</div>
                            <div class="info">
                                <div>
                                    <span class="label">租金</span>
                                    <span class="value price">¥${house.rent}</span>
                                </div>
                                <div>
                                    <span class="label">区域</span>
                                    <span class="value">${house.house_site}</span>
                                </div>
                                <div>
                                    <span class="label">户型</span>
                                    <span class="value">${house.house_type}</span>
                                </div>
                                <div>
                                    <span class="label">面积</span>
                                    <span class="value">${house.area}㎡</span>
                                </div>
                            </div>
                            <div class="tags">
                                ${house.matched_filters ? house.matched_filters.map(f => 
                                    `<span class="tag">${f}</span>`
                                ).join('') : ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    houseItems.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                            <p>暂无符合条件的新房源</p>
                            <p style="font-size: 14px; margin-top: 10px;">继续保持关注哦~</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('house-items').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <p>数据加载失败，请稍后刷新</p>
                        <p style="font-size: 14px; margin-top: 10px;">错误信息：${error.message}</p>
                    </div>
                `;
            }
        }
        
        // 页面加载时获取数据
        window.addEventListener('DOMContentLoaded', loadData);
        
        // 每5分钟自动刷新数据
        setInterval(loadData, 5 * 60 * 1000);
    </script>
    <script src="./app.js"></script>
</body>
</html>
