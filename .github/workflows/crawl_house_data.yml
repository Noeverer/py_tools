name: Crawl House Data

on:
  schedule:
    # 每小时执行一次（可以根据需要调整）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  crawl-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome and ChromeDriver
      run: |
        # 安装Google Chrome
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        # 获取Chrome版本并安装对应的ChromeDriver
        CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+' | cut -d. -f1,2)
        echo "Chrome version: $CHROME_VERSION"

        # 从Chrome 115开始，ChromeDriver的下载方式有所改变
        if [ "$CHROME_VERSION" \< "115" ]; then
          # 旧版Chrome使用传统URL
          CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION/chromedriver_linux64.zip"
        else
          # 新版Chrome使用ChromeForTesting API
          CHROME_FULL_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FULL_VERSION/linux64/chromedriver-linux64.zip"
        fi

        echo "Downloading ChromeDriver from: $CHROMEDRIVER_URL"
        wget -O /tmp/chromedriver.zip $CHROMEDRIVER_URL || { echo "Failed to download ChromeDriver"; exit 1; }
        sudo unzip /tmp/chromedriver.zip -d /opt/

        # 检查解压后的文件结构并移动到正确位置
        if [ -f "/opt/chromedriver-linux64/chromedriver" ]; then
          sudo cp /opt/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        else
          sudo cp /opt/chromedriver /usr/local/bin/chromedriver
        fi

        sudo chmod +x /usr/local/bin/chromedriver

    - name: Set up config
      run: |
        # 创建配置文件，使用GitHub Secrets中的BARK_KEY
        echo "BARK_KEY = \"${{ secrets.BARK_KEY }}\"" > config/settings.py
        echo "PUSH_GROUP = \"公租房通知\"" >> config/settings.py
        echo "CRAWLER_DELAY = 5" >> config/settings.py
        echo "MAX_RETRIES = 3" >> config/settings.py
        echo "DATA_DIR = \"data/\"" >> config/settings.py
        echo "LOGS_DIR = \"logs/\"" >> config/settings.py
        echo "DEFAULT_FILTERS = {" >> config/settings.py
        echo "    'min_rent': None," >> config/settings.py
        echo "    'max_rent': None," >> config/settings.py
        echo "    'area': None," >> config/settings.py
        echo "    'house_type': None" >> config/settings.py
        echo "}" >> config/settings.py

    - name: Run crawler
      run: |
        python main.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit"
        else
          git commit -m "Add new house data $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}