name: Crawl House Data

on:
  schedule:
    # 每天8-11点每小时执行一次（8点、9点、10点、11点）
    - cron: '0 8-11 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  crawl-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome and ChromeDriver
      run: |
        # 安装Google Chrome
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        # 获取Chrome版本并安装对应的ChromeDriver
        CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+' | cut -d. -f1,2)
        echo "Chrome version: $CHROME_VERSION"

        # 从Chrome 115开始，ChromeDriver的下载方式有所改变
        if [ "$CHROME_VERSION" \< "115" ]; then
          # 旧版Chrome使用传统URL
          CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION/chromedriver_linux64.zip"
        else
          # 新版Chrome使用ChromeForTesting API
          CHROME_FULL_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FULL_VERSION/linux64/chromedriver-linux64.zip"
        fi

        echo "Downloading ChromeDriver from: $CHROMEDRIVER_URL"
        wget -O /tmp/chromedriver.zip $CHROMEDRIVER_URL || { echo "Failed to download ChromeDriver"; exit 1; }
        sudo unzip /tmp/chromedriver.zip -d /opt/

        # 检查解压后的文件结构并移动到正确位置
        if [ -f "/opt/chromedriver-linux64/chromedriver" ]; then
          sudo cp /opt/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        else
          sudo cp /opt/chromedriver /usr/local/bin/chromedriver
        fi

        sudo chmod +x /usr/local/bin/chromedriver

    - name: Set up config
      run: |
        # 创建配置文件，使用GitHub Secrets中的BARK_KEY
        echo "#!/usr/bin/env python3" > config/settings.py
        echo "# -*- coding: utf-8 -*-" >> config/settings.py
        echo '"""' >> config/settings.py
        echo '配置文件' >> config/settings.py
        echo '"""' >> config/settings.py
        echo "" >> config/settings.py
        echo "BARK_KEY = \"${{ secrets.BARK_KEY }}\"" >> config/settings.py
        echo "PUSH_GROUP = \"公租房通知\"" >> config/settings.py
        echo "CRAWLER_DELAY = 5" >> config/settings.py
        echo "MAX_RETRIES = 3" >> config/settings.py
        echo "DATA_DIR = \"data/\"" >> config/settings.py
        echo "LOGS_DIR = \"logs/\"" >> config/settings.py
        echo "DEFAULT_FILTERS = {" >> config/settings.py
        echo "    'min_rent': None," >> config/settings.py
        echo "    'max_rent': 5000," >> config/settings.py
        echo "    'area': None," >> config/settings.py
        echo "    'house_type': None" >> config/settings.py
        echo "}" >> config/settings.py
        echo "" >> config/settings.py
        echo "# 特定监控地点设置" >> config/settings.py
        echo "MONITORED_LOCATIONS = [" >> config/settings.py
        echo "    \"张江\"," >> config/settings.py
        echo "    \"唐镇\"," >> config/settings.py
        echo "    \"曹路\"," >> config/settings.py
        echo "    \"合庆\"," >> config/settings.py
        echo "    \"金桥\"," >> config/settings.py
        echo "    \"陆家嘴\"," >> config/settings.py
        echo "    \"金杨新村\"," >> config/settings.py
        echo "    \"洋泾\"," >> config/settings.py
        echo "    \"花木\"," >> config/settings.py
        echo "    \"康桥\"" >> config/settings.py
        echo "]" >> config/settings.py
        echo "" >> config/settings.py
        echo "# 特定地点推送配置" >> config/settings.py
        echo "LOCATION_BARK_KEYS = {" >> config/settings.py
        echo "    # 可以为不同的地点设置不同的推送密钥" >> config/settings.py
        echo "    # \"张江\": \"your_zhangjiang_bark_key\"," >> config/settings.py
        echo "    # 如果为空，则使用默认的BARK_KEY" >> config/settings.py
        echo "}" >> config/settings.py
        echo "" >> config/settings.py
        echo "# 特定房型监控" >> config/settings.py
        echo "MONITORED_HOUSE_TYPES = [" >> config/settings.py
        echo "    # 在这里添加您想要监控的特定房型" >> config/settings.py
        echo "    # 例如：" >> config/settings.py
        echo "    # \"1室1厅\"," >> config/settings.py
        echo "    # \"2室1厅\"" >> config/settings.py
        echo "]" >> config/settings.py

    - name: Run crawler
      run: |
        python main.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Generate dates index
      run: |
        # 生成包含所有可用日期的索引文件
        echo "{" > dates_index.json
        echo "  \"dates\": [" >> dates_index.json
        # 获取所有house_data_*.csv文件的日期部分
        csv_files=$(ls ../data/house_data_*.csv 2>/dev/null | sort -r)
        if [ -n "$csv_files" ]; then
          first=true
          for file in $csv_files; do
            date_part=$(basename "$file" | sed 's/house_data_\([0-9-]*\)\.csv/\1/')
            if [ "$first" = true ]; then
              echo "    \"$date_part\"" >> dates_index.json
              first=false
            else
              echo "    ,\"$date_part\"" >> dates_index.json
            fi
          done
        fi
        echo "  ]" >> dates_index.json
        echo "}" >> dates_index.json
        # 移动到data目录
        mv dates_index.json ../data/

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit"
        else
          git commit -m "Add new house data $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}