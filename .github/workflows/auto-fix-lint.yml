name: Auto Fix Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  python-lint:
    name: Python Lint & Auto Fix
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black isort autoflake flake8 mypy
      
      - name: Black format check
        run: |
          echo "Checking Python code formatting with black..."
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs black --check --diff || {
            echo "Formatting issues found, auto-fixing..."
            find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs black
          }
      
      - name: isort import sorting
        run: |
          echo "Sorting Python imports with isort..."
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs isort --check-only --diff || {
            echo "Import sorting issues found, auto-fixing..."
            find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs isort
          }
      
      - name: autoflake cleanup
        run: |
          echo "Removing unused imports with autoflake..."
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs autoflake --in-place --remove-all-unused-imports --remove-duplicate-keys
      
      - name: flake8 linting
        run: |
          echo "Running flake8 linting..."
          flake8 . --exclude=venv,node_modules,__pycache__,.git --max-line-length=100 --ignore=E203,W503 || echo "Linting issues found (non-blocking)"
        continue-on-error: true
      
      - name: Commit fixes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: Apply Python linting fixes [skip ci]"
          git push || echo "No changes to commit or push failed"
        continue-on-error: true

  javascript-lint:
    name: JavaScript/TypeScript Lint & Auto Fix
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install linting tools
        run: |
          npm install -g eslint prettier @typescript-eslint/parser @typescript-eslint/eslint-plugin
      
      - name: eslint check & fix
        run: |
          echo "Checking JavaScript/TypeScript with eslint..."
          find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" | \
            grep -v node_modules | \
            xargs eslint --max-warnings=0 || {
            echo "Linting issues found, auto-fixing..."
            find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" | \
              grep -v node_modules | \
              xargs eslint --fix || true
          }
        continue-on-error: true
      
      - name: prettier format check
        run: |
          echo "Checking code formatting with prettier..."
          find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" -o -name "*.json" | \
            grep -v node_modules | \
            xargs prettier --check || {
            echo "Formatting issues found, auto-fixing..."
            find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" -o -name "*.json" | \
              grep -v node_modules | \
              xargs prettier --write
          }
      
      - name: Commit fixes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: Apply JS/TS linting fixes [skip ci]"
          git push || echo "No changes to commit or push failed"
        continue-on-error: true
