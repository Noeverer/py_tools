name: Auto Fix & Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip lint and auto-fix'
        required: false
        default: 'false'
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-fix:
    name: Lint & Auto Fix
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_lint != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python linting tools
        run: |
          pip install --upgrade pip
          pip install black isort autoflake flake8
      
      - name: Install Node.js linting tools
        run: |
          npm install -g eslint prettier
      
      - name: Run Python auto-fix
        run: |
          echo "Running Python auto-fix..."
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs black --quiet
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs isort --quiet
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs autoflake --in-place --remove-all-unused-imports
          echo "Python auto-fix completed"
      
      - name: Run Python linter
        run: |
          flake8 . --exclude=venv,node_modules,__pycache__,.git --max-line-length=100 --ignore=E203,W503 || true
          echo "Python linting completed"
      
      - name: Run JavaScript/TypeScript auto-fix
        run: |
          echo "Running JavaScript/TypeScript auto-fix..."
          find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" | \
            xargs eslint --fix --quiet || true
          find . -name "*.js" -o -name "*.ts" -o -name "*.json" | \
            xargs prettier --write --quiet || true
          echo "JavaScript/TypeScript auto-fix completed"
      
      - name: Commit auto-fix changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "auto-fix: Apply code formatting fixes [skip ci]"
          git push || echo "No changes to commit or push failed"
        continue-on-error: true

  dependency-check:
    name: Dependency Check & Fix
    runs-on: ubuntu-latest
    needs: lint-and-fix
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Check Python dependencies
        run: |
          echo "Checking Python dependencies..."
          find . -name "requirements*.txt" -type f | while read file; do
            echo "Processing $file..."
            if [ -f "$file" ]; then
              pip install --upgrade pip
              pip install --upgrade -r "$file" || echo "Some packages failed to upgrade"
            fi
          done
      
      - name: Check package.json dependencies
        run: |
          echo "Checking Node.js dependencies..."
          find . -name "package.json" -type f ! -path "*/node_modules/*" | while read file; do
            echo "Processing $file..."
            cd "$(dirname "$file")"
            npm audit fix || true
            npm update || true
          done

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: dependency-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          find . -name "requirements*.txt" -type f -exec pip install -r {} \; || true
      
      - name: Run tests
        run: |
          echo "Running tests..."
          find . -name "test_*.py" -o -name "*_test.py" | head -20 | xargs python -m pytest -v || echo "No tests found or tests failed"
        continue-on-error: true
      
      - name: Validate Python syntax
        run: |
          echo "Validating Python syntax..."
          find . -name "*.py" -type f ! -path "*/venv/*" ! -path "*/node_modules/*" | xargs python -m py_compile || echo "Syntax errors found"
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment != 'dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
      
      - name: Pre-deployment validation
        run: |
          echo "Running pre-deployment validation..."
          # Add any custom validation scripts here
          echo "Pre-deployment validation passed"
      
      - name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
        run: |
          echo "Deploying to ${{ github.event.inputs.environment || 'dev' }}..."
          # Add deployment commands here
          echo "Deployment completed"
      
      - name: Post-deployment health check
        run: |
          echo "Running post-deployment health check..."
          # Add health check commands here
          echo "Health check passed"
      
      - name: Notify success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Deployment successful to ${{ github.event.inputs.environment || "dev" }}'
            })
      
      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Deployment failed: ${{ job.status }}'
            })
