import smtplib
import os
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart

def send_email():
    smtp_server = os.environ.get("SMTP_SERVER", "smtp.gmail.com")
    smtp_port = int(os.environ.get("SMTP_PORT", 587))
    sender_email = os.environ.get("EMAIL_USER")
    sender_password = os.environ.get("EMAIL_PASS")
    receiver_email = os.environ.get("RECEIVER_EMAIL", sender_email)
    
    # Create message
    msg = MIMEMultipart()
    msg['From'] = sender_email
    msg['To'] = receiver_email
    msg['Subject'] = f"[公租房爬虫]任务执行状态通知 - {os.environ.get('RUN_TIME')}"

    body = f"""<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公租房爬虫任务状态通知</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; border: 1px solid #eaeaea; padding: 20px; border-radius: 8px;">
        <h2 style="color: #2c3e50;">公租房爬虫任务执行状态通知</h2>
        <table style="border-collapse: collapse; width: 100%;">
            <tr style="background-color: #f8f9fa;">
                <td style="padding: 8px; border: 1px solid #ddd;"><strong>项目名称</strong></td>
                <td style="padding: 8px; border: 1px solid #ddd;">{os.environ.get('GITHUB_REPOSITORY')}</td>
            </tr>
            <tr>
                <td style="padding: 8px; border: 1px solid #ddd;"><strong>工作流名称</strong></td>
                <td style="padding: 8px; border: 1px solid #ddd;">{os.environ.get('GITHUB_WORKFLOW')}</td>
            </tr>
            <tr style="background-color: #f8f9fa;">
                <td style="padding: 8px; border: 1px solid #ddd;"><strong>执行状态</strong></td>
                <td style="padding: 8px; border: 1px solid #ddd; color: {'#e74c3c' if os.environ.get('JOB_STATUS') == 'failure' else '#2ecc71'};">{os.environ.get('JOB_STATUS')}</td>
            </tr>
            <tr>
                <td style="padding: 8px; border: 1px solid #ddd;"><strong>执行时间</strong></td>
                <td style="padding: 8px; border: 1px solid #ddd;">{os.environ.get('RUN_TIME')}</td>
            </tr>
            <tr style="background-color: #f8f9fa;">
                <td style="padding: 8px; border: 1px solid #ddd;"><strong>运行ID</strong></td>
                <td style="padding: 8px; border: 1px solid #ddd;">{os.environ.get('GITHUB_RUN_ID')}</td>
            </tr>
        </table>
        <br>
        <p>请检查任务执行情况，如有问题请及时处理。</p>
    </div>
</body>
</html>"""
    
    msg.attach(MIMEText(body, 'html', 'utf-8'))
    
    try:
        server = smtplib.SMTP(smtp_server, smtp_port)
        server.starttls()
        server.login(sender_email, sender_password)
        text = msg.as_string()
        server.sendmail(sender_email, receiver_email, text)
        server.quit()
        print("Email notification sent successfully!")
    except Exception as e:
        print(f"Failed to send email: {str(e)}")

if __name__ == "__main__":
    send_email()
import os
import urllib.parse
import requests

def send_bark_notification():
    bark_url = os.environ.get('BARK_URL')
    message = os.environ.get('MESSAGE')
    repo_name = os.environ.get('REPO_NAME')
    workflow_name = os.environ.get('WORKFLOW_NAME')
    status = os.environ.get('STATUS')
    run_time = os.environ.get('RUN_TIME')
    run_id = os.environ.get('RUN_ID')

    # 构建通知标题和内容
    title = f"公租房爬虫任务通知"
    content = f"Repo: {repo_name}%0AWorkflow: {workflow_name}%0AStatus: {status}%0ARun Time: {run_time}%0ARun ID: {run_id}"
    
    # 确保Bark URL格式正确
    if not bark_url.startswith(('http://', 'https://')):
        if bark_url.startswith('api.day.app'):
            bark_url = f"https://{bark_url}"
        else:
            bark_url = f"https://api.day.app/{bark_url}"
    
    # 构建完整的请求URL
    request_url = f"{bark_url}/{urllib.parse.quote(title)}/{urllib.parse.quote(content)}?icon=https://raw.githubusercontent.com/azhuge233/Pixiv-Daily-Ranking/master/icon.png&group=公租房爬虫"
    
    try:
        response = requests.get(request_url)
        if response.status_code == 200:
            print("Bark notification sent successfully!")
        else:
            print(f"Failed to send Bark notification. Status code: {response.status_code}")
    except Exception as e:
        print(f"Error sending Bark notification: {str(e)}")

if __name__ == "__main__":
    send_bark_notification()
name: 公租房爬虫定时任务

on:
  # 定时触发 - 每天北京时间 9:00 和 15:00 (UTC 1:00 和 7:00)
  schedule:
    - cron: '0 1,7 * * *'  # 每天两次，UTC时间1点和7点，即北京时间9点和15点
  
  # 手动触发
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal    # 正常运行
          - debug     # 调试模式
          - test      # 测试模式

# 并发控制：同一时间只运行一个爬虫任务
concurrency:
  group: gzf-spider
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 添加超时限制，防止任务卡死
    timeout-minutes: 30
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r gzf_Spider/requirement.txt
          pip install smtplib pillow requests  # 添加邮件发送和HTTP请求相关依赖
          
      - name: 安装Chrome浏览器
        run: |
          # 安装Chrome浏览器
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          google-chrome --version
          echo "Chrome安装完成"

      - name: 安装ChromeDriver
        run: |
          # 获取Chrome版本
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+' | head -c 2)
          # 下载对应版本的ChromeDriver
          if [ -z "$CHROME_VERSION" ]; then
            CHROME_VERSION="114"  # 默认版本
          fi
          
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION.0.0/chromedriver-linux64.zip"
          echo "正在下载ChromeDriver: $CHROMEDRIVER_URL"
          
          wget -q $CHROMEDRIVER_URL -O /tmp/chromedriver.zip
          sudo unzip -o /tmp/chromedriver.zip -d /opt/
          sudo chmod +x /opt/chromedriver-linux64/chromedriver
          sudo ln -sf /opt/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          
          chromedriver --version
          echo "ChromeDriver安装完成"

      - name: 准备数据库环境
        run: |
          # 如果需要数据库支持，可以在这里初始化
          echo "准备数据库环境..."
          # 检查SQL文件是否存在
          if [ -f "gzf_Spider/src/house_init.sql" ]; then
            echo "发现数据库初始化文件"
          else
            echo "未找到数据库初始化文件"
          fi
          
      - name: 执行公租房爬虫
        env:
          # ==========================================
          # 数据库配置（可选）
          # ==========================================
          DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER || 'root' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'house_data' }}
          
          # ==========================================
          # 邮件通知配置（可选）
          # ==========================================
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL || secrets.EMAIL_USER }}
          
          # ==========================================
          # Bark通知配置（可选）
          # ==========================================
          BARK_URL: ${{ secrets.BARK_URL }}  # 如 https://api.day.app/your_bark_key
          
          # ==========================================
          # 爬虫配置
          # ==========================================
          DEBUG_MODE: ${{ github.event.inputs.run_mode == 'debug' && 'true' || 'false' }}
          
        run: |
          echo "=========================================="
          echo "🕷️ 开始执行公租房爬虫任务"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: ${{ github.event.inputs.run_mode || 'normal' }}"
          echo "📋 检查依赖项..."
          
          # 检查Chrome浏览器
          if command -v google-chrome-stable &> /dev/null; then
              echo "✅ Chrome浏览器已安装: $(google-chrome-stable --version)"
          else
              echo "❌ Chrome浏览器未安装"
              exit 1
          fi
          
          # 检查ChromeDriver
          if command -v chromedriver &> /dev/null; then
              echo "✅ ChromeDriver已安装: $(chromedriver --version)"
          else
              echo "❌ ChromeDriver未安装"
              exit 1
          fi
          
          # 检查Python依赖
          python -c "import selenium; print(f'✅ Selenium版本: {selenium.__version__}')"
          python -c "import requests; print(f'✅ Requests版本: {requests.__version__}')"
          
          echo ""
          echo "=========================================="
          echo "🔧 开始执行爬虫脚本"
          echo "=========================================="
          
          # 进入项目目录并执行
          cd gzf_Spider
          
          # 根据运行模式决定如何执行脚本
          if [ "${{ github.event.inputs.run_mode }}" = "debug" ]; then
            echo "🐛 启动调试模式..."
            python -u main.py --mode debug
          elif [ "${{ github.event.inputs.run_mode }}" = "test" ]; then
            echo "🧪 启动测试模式..."
            python -u main.py --mode test
          else
            echo "🚀 启动正常模式..."
            python -u main.py --mode normal
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ 爬虫任务执行完成"
          echo "=========================================="
      
      - name: 上传日志文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gzf-spider-logs-${{ github.run_number }}
          path: |
            gzf_Spider/*.log
            gzf_Spider/src/*.log
          retention-days: 30
      
      - name: 发送通知
        if: always()
        run: |
          # 获取任务状态
          STATUS="${{ job.status }}"
          RUN_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          REPO_NAME="${{ github.repository }}"
          WORKFLOW_NAME="${{ github.workflow }}"
          
          # 发送Bark通知（如果配置了BARK_URL）
          if [[ -n "${{ secrets.BARK_URL }}" ]]; then
            # 设置环境变量并运行Python脚本
            export MESSAGE="Repo: $REPO_NAME
Workflow: $WORKFLOW_NAME
Status: $STATUS
Run Time: $RUN_TIME
Run ID: ${{ github.run_id }}"
            export REPO_NAME="$REPO_NAME"
            export WORKFLOW_NAME="$WORKFLOW_NAME"
            export STATUS="$STATUS"
            export RUN_TIME="$RUN_TIME"
            export RUN_ID="${{ github.run_id }}"
            export BARK_URL="${{ secrets.BARK_URL }}"
            
            python gzf_Spider/scripts/send_bark_notification.py
          else
            echo "Bark URL not configured, skipping Bark notification."
          fi
          
          # 发送邮件通知（如果配置了邮件设置）
          if [[ -n "${{ secrets.EMAIL_USER }}" && -n "${{ secrets.EMAIL_PASS }}" && -n "${{ secrets.SMTP_SERVER }}" ]]; then
            # 设置环境变量并运行Python脚本
            export JOB_STATUS="$STATUS"
            export RUN_TIME="$RUN_TIME"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_WORKFLOW="${{ github.workflow }}"
            export GITHUB_RUN_ID="${{ github.run_id }}"
            export SMTP_SERVER="${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}"
            export SMTP_PORT="${{ secrets.SMTP_PORT || '587' }}"
            export EMAIL_USER="${{ secrets.EMAIL_USER }}"
            export EMAIL_PASS="${{ secrets.EMAIL_PASS }}"
            export RECEIVER_EMAIL="${{ secrets.RECEIVER_EMAIL || secrets.EMAIL_USER }}"
            
            python gzf_Spider/scripts/send_notification_email.py
          else
            echo "Email settings not fully configured, skipping email notification."
          fi